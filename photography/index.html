  <script>
    (function () {
      var mosaic = document.getElementById('photo-mosaic');
      var lightbox = document.getElementById('photo-lightbox');
      var lightboxImg = document.getElementById('photo-lightbox-img');

      function classify(w, h) {
        var ratio = w / h;
        if (ratio > 1.05) return 'landscape';
        if (ratio < 0.95) return 'portrait';
        return 'square';
      }

      function applyOrientation(link, img) {
        var w = img.naturalWidth;
        var h = img.naturalHeight;
        if (!w || !h) return;
        var type = classify(w, h);
        link.className = 'is-' + type;
        link.style.aspectRatio = w + ' / ' + h;
        link.setAttribute('data-orient', type);
      }

      function shuffleArray(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i];
          arr[i] = arr[j];
          arr[j] = t;
        }
        return arr;
      }

      function interleaveShuffle(items) {
        var wide = [];
        var tall = [];
        items.forEach(function (el) {
          var o = el.getAttribute('data-orient');
          if (o === 'landscape' || o === 'square') wide.push(el);
          else tall.push(el);
        });
        shuffleArray(tall);
        shuffleArray(wide);
        var out = [];
        var gap = Math.max(4, Math.ceil(tall.length / (wide.length + 1)));
        var ti = 0;
        var wi = 0;
        while (ti < tall.length || wi < wide.length) {
          if (wi < wide.length && out.length > 0 && out.length % gap === 0) {
            out.push(wide[wi++]);
          } else if (ti < tall.length) {
            out.push(tall[ti++]);
          } else if (wi < wide.length) {
            out.push(wide[wi++]);
          }
        }
        return out;
      }

      function whenAllReady(callback) {
        var links = mosaic.querySelectorAll('a');
        var pending = links.length;
        if (!pending) {
          callback();
          return;
        }
        links.forEach(function (link) {
          var img = link.querySelector('img');
          function done() {
            applyOrientation(link, img);
            pending -= 1;
            if (pending === 0) callback();
          }
          if (img.complete && img.naturalWidth) done();
          else img.addEventListener('load', done, { once: true });
          img.addEventListener('error', done, { once: true });
        });
      }

      whenAllReady(function () {
        var items = Array.prototype.slice.call(mosaic.querySelectorAll('a'));
        interleaveShuffle(items).forEach(function (el) { mosaic.appendChild(el); });
      });

      mosaic.addEventListener('click', function (event) {
        var link = event.target.closest('a');
        if (!link) return;
        event.preventDefault();
        lightboxImg.src = link.href;
        lightboxImg.alt = link.querySelector('img').alt;
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
      });

      function closeLightbox() {
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImg.src = '';
      }

      lightbox.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeLightbox();
      });
    })();
  </script>
